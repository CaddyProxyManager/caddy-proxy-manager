version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Security updates always get their own PR
    versioning-strategy: increase

  # Caddy and plugin version pins compiled into the caddy image (docker/caddy/go.mod).
  # Nothing imports these modules; they are a version catalog docker/caddy/build.sh reads.
  - package-ecosystem: "gomod"
    directory: "/docker/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "caddy"
      - "security"
    commit-message:
      prefix: "caddy"
    groups:
      caddy-build:
        patterns:
          - "github.com/caddyserver/*"
          - "github.com/caddy-dns/*"
          - "github.com/mholt/caddy-l4"
          - "github.com/fuomag9/caddy-blocker-plugin"
          - "github.com/corazawaf/coraza-caddy/v2"
          - "github.com/google/cel-go"
          - "cel.dev/cel-go"

  - package-ecosystem: "docker"
    directory: "/docker/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker"
    directory: "/docker/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker"
    directory: "/docker/agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

  # The third-party images docker-compose.yml runs, pinned by tag and digest. Our own web, caddy and
  # agent images stay on :latest there, and release.yml pins those per release.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

name: Tests

on:
  # Not main: everything reaches it through a PR whose checks ran on the merge result, and direct
  # pushes to main are not permitted.
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests need no credentials, and nothing here references secrets.
    permissions: {}

    # No postgres service: with-test-db.ts needs `-c max_connections=1000` and a tmpfs data dir,
    # which a service container cannot take.
    services:
      # A real OIDC provider for oauth-flow.test.ts; unit tests stub betterAuth outright.
      # Keep JSON_CONFIG in step with MOCK_IDP_JSON_CONFIG in tests/helpers/mock-idp.ts.
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"sub":"test-oauth-user","email":"oauth@test.local","email_verified":true,"name":"Test OAuth User","role":"admin"}}]}]}'
        ports:
          - 5599:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The oven/bun tag in docker/web and docker/agent, so CI tests what the images build with.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails only on errors, so Biome's warnings stay advisory.
      - name: Lint and format check
        run: bun run lint

      - name: Type-check clean dependency graph
        run: bun run typecheck

      # The OAuth test skips when the IdP is unreachable, so a dead container must fail the job.
      - name: Wait for the mock OIDC provider
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5599/default/.well-known/openid-configuration > /dev/null; then
              echo "mock-oidc ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "mock-oidc did not become ready"; exit 1

      - name: Run unit and integration tests with coverage
        env:
          TEST_OIDC_URL: http://localhost:5599
        run: bun run test:coverage

      - name: Run the controller's tests against SQLite
        env:
          TEST_OIDC_URL: http://localhost:5599
        run: bun run --filter @cpm/controller test:sqlite

      - name: Upload coverage report
        # Always: a threshold failure is when the per-file breakdown matters.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: apps/controller/coverage/
          retention-days: 14

      - name: Build production application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgres://cpm:build@127.0.0.1:5/unused
          SESSION_SECRET: ci-build-session-secret-at-least-32-chars
          ADMIN_PASSWORD: ci-build-admin-password
        run: bun run build

      # Swagger UI is the largest chunk at ~360 KiB; a new one past this fails instead of warning.
      - name: Bundle size budget
        run: bun scripts/check-bundle-budget.ts apps/controller/dist/client --max-kib=400

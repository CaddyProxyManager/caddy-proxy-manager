name: Site

on:
  # Per release, since the docs run the controller's components live. Release dispatches this on
  # main (a GITHUB_TOKEN release raises no event, and Pages deploys only from main); dispatch by
  # hand for an urgent docs fix. PRs build and test only. All of controller `src/`: demos reach it.
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/controller/src/**"
      - "apps/controller/messages/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# The deploy job asks for Pages' permissions itself, so a PR's run never holds them.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The oven/bun tag in docker/web and docker/agent, so CI tests what the images build with.
          bun-version: 1.4.2

      # The whole workspace: apps/site has no lockfile of its own.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before the build: stale demo data fails here with the field named.
      - name: Unit tests
        run: bun run --filter @cpm/site test

      - name: Build the site
        run: bun run --filter @cpm/site build

      # From apps/site so bunx resolves the pinned CLI, not the latest - see e2e.yml.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: apps/site
        run: echo "version=$(bunx playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/site
        run: bunx playwright install chromium

      # Apt packages outside the cache, so this runs on a hit too; a no-op once present.
      - name: Install Chromium system dependencies
        working-directory: apps/site
        run: bunx playwright install-deps chromium

      # Every demo on every built page hydrates without an error.
      - name: Demo smoke test
        working-directory: apps/site
        run: bunx playwright test

      - name: Upload the artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # `pages` to publish and `id-token` for the deployment's OIDC exchange.
    permissions:
      pages: write
      id-token: write
    # Never cancel a deploy in flight: a half-finished one leaves the site inconsistent.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

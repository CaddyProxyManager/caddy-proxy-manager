name: Refresh Caddy compatibility pins

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docker/caddy/go.mod

      - name: Refresh Caddy compatibility replacement
        run: sh docker/caddy/update-compatibility-pins.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- docker/caddy/go.mod docker/caddy/go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updated Caddy image
        if: steps.changes.outputs.changed == 'true'
        # Placeholders for docker-compose.yml's `:?` variables, which abort interpolation on a
        # runner with no .env. Keep in step with every `:?`: this only runs when pins move, so a
        # missing one hides behind weeks of green runs.
        env:
          SESSION_SECRET: pin-verify-interpolation-placeholder
          POSTGRES_PASSWORD: pin-verify-interpolation-placeholder
        run: docker compose build caddy

      # GITHUB_TOKEN starts no workflows, so a maintainer closes and reopens the PR to run the
      # required checks. No PAT, by design.
      - name: Open compatibility-pin pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/caddy-compatibility-pins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add docker/caddy/go.mod docker/caddy/go.sum
          git commit -m "caddy: refresh compatibility pins"
          git push --force origin "$branch"
          if ! gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "caddy: refresh compatibility pins" \
              --body "Automated compatibility-pin refresh derived from the pinned Caddy module. The Caddy image build passed before this PR was opened."
          fi

name: Build and Push Docker Images (Trusted)

# Released versions only. Release dispatches this at its v* tag (a GITHUB_TOKEN tag triggers
# nothing); the gate job refuses any ref that is not a release tag on main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<service>; metadata-action lowercases it.
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

# A newer run on the same ref supersedes the older; distinct tags never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release tag gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      newest: ${{ steps.gate.outputs.newest }}
      latest: ${{ steps.gate.outputs.latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and branch, for the ancestry and ordering checks.
          fetch-depth: 0

      - name: Refuse anything but a release tag on main
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Otherwise a branch dispatch publishes images of unreviewed code.
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::images are published only from a vX.Y.Z tag, not ${REF_TYPE} '${TAG}'"
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${TAG} (${GITHUB_SHA}) is not reachable from main"
            exit 1
          fi

          # Only the newest release moves floating tags, so re-dispatching an old one cannot roll
          # :latest or :3 back. versionsort.suffix sorts v3.0.0-rc.3 before v3.0.0.
          newest="$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ "$TAG" = "$newest" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

          # docker-compose.yml runs :latest, so it follows 3.0.0 prereleases until a stable v3+.
          stable_exists=false
          if git tag -l 'v*' | grep -v -- '-' | grep -Eq '^v([3-9]|[1-9][0-9]+)\.'; then
            stable_exists=true
          fi
          if [ "$TAG" = "$newest" ] && { [[ "$TAG" != *-* ]] || [ "$stable_exists" = false ]; }; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: "${{ matrix.name }}"
    needs: gate
    runs-on: ubuntu-latest
    # Healthy runs take minutes; a wedged one would otherwise burn the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: Web Dashboard
            service: web
            # MiB, uncompressed amd64; raise it on purpose, never to make a build pass.
            max-mib: 310
            dockerfile: docker/web/Dockerfile
            context: .
            title: Caddy Proxy Manager Web Dashboard
            description: Web UI and API for managing Caddy reverse proxies, certificates and routes.
          - name: Caddy Handler
            service: caddy
            max-mib: 150
            dockerfile: docker/caddy/Dockerfile
            context: .
            title: Caddy Proxy Manager Caddy Handler
            description: Caddy built with xcaddy, bundling the DNS, layer-4 and WAF plugins Caddy Proxy Manager configures.
          - name: Builder Agent
            service: agent
            max-mib: 335
            dockerfile: docker/agent/Dockerfile
            context: .
            title: Caddy Proxy Manager Builder Agent
            description: Host-side agent that rebuilds the Caddy image and recreates its container on behalf of Caddy Proxy Manager.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The default leaves the multi-arch index bare, and GHCR reads its package page from it.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          # Otherwise all three images take the repository's title and description. The
          # Dockerfiles repeat these for local builds.
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=CaddyProxyManager
            org.opencontainers.image.documentation=https://caddyproxy.com/
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=CaddyProxyManager
            org.opencontainers.image.documentation=https://caddyproxy.com/
          # The gate decides floating tags: latest=auto would move :latest for a re-dispatched old tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.gate.outputs.newest == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.gate.outputs.newest == 'true' }}
            type=match,pattern=v(.*),group=1
            type=sha
            type=raw,value=latest,enable=${{ needs.gate.outputs.latest == 'true' }}

      # Baked into the UI and OpenAPI spec. The gate guarantees a v* tag.
      - name: Compute app version
        id: app-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Before anything is pushed, so an image over budget never ships. amd64 only: the budgets are
      # measured there, and the push below reuses these layers from the cache.
      - name: Build amd64 for the size check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: cpm-size-check/${{ matrix.service }}:local
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          platforms: linux/amd64

      - name: Check the image size budget
        run: ./scripts/check-image-size.sh "cpm-size-check/${{ matrix.service }}:local" "${{ matrix.max-mib }}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true

      # 3.6.1 looks for releases at the repository-named path, before images moved to the owner's
      # root. The version tag alone, pointing at the same index, keeps it finding them.
      - name: Tag the release where 3.6.1 looks for it
        if: matrix.service == 'web'
        env:
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web@${{ steps.build.outputs.digest }}
          LEGACY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caddy-proxy-manager/web
          VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          source="${SOURCE,,}"
          legacy="${LEGACY,,}"
          docker buildx imagetools create --tag "${legacy}:${VERSION}" "$source"

  # For hosts with no route to a registry: our images saved per architecture, the deploy files with
  # a load script, and a signed manifest naming the third-party images by digest, never bundling
  # them. Attached to the release this tag's release.yml run created.
  airgap:
    name: "Air-gap bundle (${{ matrix.arch }})"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      # Keyless Sigstore signing: the certificate names this workflow at this tag, so no key to keep.
      id-token: write
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the bundle
        env:
          ARCH: ${{ matrix.arch }}
          NAMESPACE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="${NAMESPACE,,}"
          # The images build-and-push just published, not a rebuild that could differ from them.
          for service in web caddy agent; do
            docker pull --platform "linux/${ARCH}" "${base}/${service}:${version}"
          done
          bun scripts/airgap/package.ts --version "$version" --arch "$ARCH" --out dist/airgap --image-base "$base"

      - name: Sign the manifest
        env:
          ARCH: ${{ matrix.arch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          manifest="dist/airgap/caddy-proxy-manager-${GITHUB_REF_NAME}-${ARCH}-airgap-manifest.txt"
          cosign sign-blob --yes --bundle "${manifest}.sigstore.json" "$manifest"
          # What the docs tell operators to run, so a bundle that would not verify never ships.
          cosign verify-blob --bundle "${manifest}.sigstore.json" \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$manifest"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only a draft takes assets: a published release is immutable.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
            echo "::warning::${GITHUB_REF_NAME} is already published, so its air-gap bundle cannot be attached"
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" dist/airgap/* --clobber

  # Last, so the release is never public without its bundles. A failed bundle holds it as a draft;
  # "Re-run failed jobs" retries the bundle and then this.
  publish:
    name: Publish the release
    needs: [gate, airgap]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Dispatching the deploy repository's publish in release.yml.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEWEST: ${{ needs.gate.outputs.newest }}
    steps:
      - name: Publish the draft and the deploy repository
        run: |
          set -euo pipefail
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
            echo "${GITHUB_REF_NAME} is already published."
            exit 0
          fi
          # A prerelease is never "latest"; a stable one is only when no newer tag exists.
          latest=false
          if [[ "$GITHUB_REF_NAME" != *-* ]] && [ "$NEWEST" = true ]; then latest=true; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
          gh workflow run release.yml --ref main -f deploy_tag="$GITHUB_REF_NAME"

name: Build and Push Docker Images (Trusted)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The images stay where every install pulls them from: the maintainer's
  # personal namespace, also after the repository moved to the ingres-si
  # organization. The repository's GITHUB_TOKEN cannot push there, so they
  # are pushed with GHCR_PUSH_TOKEN, a classic personal access token of the
  # maintainer with only the write:packages scope.
  IMAGE_NAME: fuomag9/caddy-proxy-manager
  GHCR_PUSH_USER: fuomag9

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: web
            dockerfile: docker/web/Dockerfile
            context: .
          - service: caddy
            dockerfile: docker/caddy/Dockerfile
            context: .
          - service: l4-port-manager
            dockerfile: docker/l4-port-manager/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check the push token
        env:
          GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        run: |
          if [ -z "$GHCR_PUSH_TOKEN" ]; then
            echo "::error::Set the GHCR_PUSH_TOKEN secret: a classic personal access token of ${GHCR_PUSH_USER} with the write:packages scope."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_PUSH_USER }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=match,pattern=v(.*),group=1
            type=sha
            # `latest` must track the newest stable release, not the default
            # branch: the repo's default branch is `develop`, so
            # {{is_default_branch}} fired on every dev push and moved `latest`
            # to unreleased builds (issue #281). Tag it only on v* tag builds,
            # excluding pre-release tags (e.g. v1.12.0-rc.1).
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Compute app version
        id: app-version
        run: |
          # Bake the release version (git tag without the leading v) into the
          # image for tag builds. Non-release (branch/dev) builds use the git
          # commit SHA so the UI shows an identifiable build reference rather
          # than a stale package.json placeholder (e.g. 1.0.0). See
          # next.config.mjs for the resolution order.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true

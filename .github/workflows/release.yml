name: Release

# The version bump is the gate. docker-build-trusted only emits semver tags for a v* ref, so a bump
# that never gets tagged ships as `latest` and nothing else.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  # Skips the version-change check; an already-released version is still a no-op.
  workflow_dispatch:
    inputs:
      backfill:
        description: Publish every stable release to the deploy repository, and release nothing
        type: boolean
        default: false

# Queue rather than cancel: the loser would abandon a version bump with no release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: ${{ !inputs.backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Dispatching the image build - see the last step.
      actions: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes and the deploy-file diff are both computed against the previous release tag.
          fetch-depth: 0

      - name: Resolve the version to release
        id: version
        env:
          # Empty on workflow_dispatch, and all-zero for a new branch; both skip the check below.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version="$(jq -er .version package.json)"
          tag="v${version}"

          # A dependency bump touches package.json too, so compare the version itself.
          if [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null; then
            before_version="$(git show "${BEFORE}:package.json" 2>/dev/null | jq -er .version 2>/dev/null || true)"
            if [ "$version" = "$before_version" ]; then
              echo "Version unchanged at ${version} - nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Empty only on a repository with no v* tag yet.
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"

          {
            echo "release=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "previous=${previous}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} (prerelease=${prerelease}, previous=${previous:-none})"

      - name: Compose release notes
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # ghcr rejects an uppercase path; metadata-action lowercases the same way at build time.
          image_base="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"

          # On disk, so `docker compose pull` cannot deliver a change to them.
          deploy_paths=(docker-compose.yml .env.example docker/clickhouse docker/socket-proxy docker/crowdsec)

          deploy_changed=""
          if [ -n "$PREVIOUS" ]; then
            deploy_changed="$(git diff --name-only "${PREVIOUS}..HEAD" -- "${deploy_paths[@]}")"
          fi

          {
            echo "## Images"
            echo
            echo '```'
            for service in web caddy agent; do
              echo "${image_base}/${service}:${VERSION}"
            done
            echo '```'
            echo
            echo "Published by the image build this release starts; give it a few minutes. The"
            echo "\`docker-compose.yml\` in the archive below already names these tags, so what you"
            echo "deploy from it stays on this release until you choose to move -- but it also means"
            echo "a \`docker compose pull\` run before the build finishes has nothing to fetch."
            echo
            echo "## Deployment files"
            echo
            echo "A clone of [${OWNER}/deploy](https://github.com/${OWNER}/deploy) upgrades with"
            echo "\`git pull && docker compose pull && docker compose up -d\`."
            echo
            if [ -n "$deploy_changed" ]; then
              echo "> [!IMPORTANT]"
              echo "> These live in your deployment directory, not in the images, so"
              echo "> \`docker compose pull\` will not update them. \`git pull\` the deploy repository"
              echo "> (or take them from the archive below) before \`docker compose up -d\`:"
              echo ">"
              while IFS= read -r file; do
                [ -n "$file" ] && echo "> - \`${file}\`"
              done <<< "$deploy_changed"
            elif [ -n "$PREVIOUS" ]; then
              echo "Unchanged since ${PREVIOUS}. Pulling the images is enough."
            else
              echo "First tagged release - take \`docker-compose.yml\` and \`.env.example\` from the archive below."
            fi
            echo
            # Flag both differences from the repository so nobody diffs the two and files a bug.
            echo "\`caddy-proxy-manager-${TAG}-deploy.tar.gz\` holds every file at its top level and"
            echo "deploys as it unpacks - extract it into one directory and \`docker compose up -d\`"
            echo "needs nothing moved. It includes the managed CrowdSec container, which stays off"
            echo "until Settings -> CrowdSec turns it on. Its \`docker-compose.yml\` differs from the"
            echo "copy in the repository in exactly two ways: it mounts its files from beside itself"
            echo "rather than from \`./docker/\`, and it pins the three images to \`${VERSION}\` rather"
            echo "than \`latest\`."
            echo "The repository copy follows \`latest\` on purpose; this one is a snapshot of one"
            echo "release and says so."
            echo
            echo "## Installing without internet access"
            echo
            echo "The image build attaches an air-gap bundle per architecture once it finishes:"
            echo "\`-airgap-<web|caddy|agent>.tar.gz\` hold our images, \`-airgap-deploy.tar.gz\` the"
            echo "deployment files and a load script, and the signed \`-airgap-manifest.txt\` their"
            echo "checksums and the third-party images to bring in by digest. See"
            echo "https://caddyproxy.com/start/offline/."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              # Capped; the compare link is the better view of a release that long.
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS}..HEAD" | head -n 100
              total="$(git rev-list --no-merges --count "${PREVIOUS}..HEAD")"
              if [ "$total" -gt 100 ]; then
                echo "- …and $((total - 100)) more"
              fi
              echo
              echo "**Full diff:** https://github.com/${REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            else
              echo "Initial release."
            fi
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Package the deployment files
        id: archive
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Flat, and its compose file rewritten to deploy as it unpacks; see the script.
          name="caddy-proxy-manager-${TAG}-deploy.tar.gz"
          ./scripts/package-deploy.sh "$VERSION" "$name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            --title "$TAG"
            --notes-file release-notes.md
            # The checked-out commit, not wherever the branch moved while the run queued.
            --target "$GITHUB_SHA"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          args+=( "$ARCHIVE" )

          gh release create "${args[@]}"

      - name: Build and publish the images for this tag
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag pushed with GITHUB_TOKEN starts no workflow; dispatch is the exception. --ref so
          # metadata-action reads the version off the tag.
          gh workflow run docker-build-trusted.yml --ref "$TAG"
          echo "Dispatched docker-build-trusted at ${TAG}"
          # The docs publish per release. On main: github-pages deploys from main only.
          gh workflow run site.yml --ref main
          echo "Dispatched site"

  # Its own job, so "Re-run failed jobs" retries just this: inside the release job the tag would
  # already exist and the rerun would skip it. Needs the DEPLOY_APP_* credentials of an app
  # installed on the deploy repository with contents: write.
  deploy-repo:
    name: Publish to the deploy repository
    needs: release
    if: >-
      !cancelled() &&
      (inputs.backfill || (needs.release.result == 'success' && needs.release.outputs.release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Token for the deploy repository
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deploy

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REPO: ${{ github.repository_owner }}/deploy
          SOURCE_REPO: ${{ github.repository }}
          BACKFILL: ${{ inputs.backfill }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$BACKFILL" = true ]; then
            # Stable releases with an archive, oldest first. Prereleases before now stay off next.
            mapfile -t tags < <(GH_TOKEN="$SOURCE_GH_TOKEN" gh release list --repo "$SOURCE_REPO"               --limit 200 --json tagName,isPrerelease               --jq '.[] | select(.isPrerelease | not) | .tagName' | sort -V)
          else
            tags=("$TAG")
          fi
          ./scripts/publish-deploy-repo.sh "${tags[@]}"

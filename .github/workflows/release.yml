name: Release

# The version bump is the gate. docker-build-trusted only emits semver tags for a v* ref, so a bump
# that never gets tagged ships as `latest` and nothing else.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  # Skips the version-change check; an already-released version is still a no-op.
  workflow_dispatch:

# Queue rather than cancel: the loser would abandon a version bump with no release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Dispatching the image build - see the last step.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes and the deploy-file diff are both computed against the previous release tag.
          fetch-depth: 0

      - name: Resolve the version to release
        id: version
        env:
          # Empty on workflow_dispatch, and all-zero for a new branch; both skip the check below.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version="$(jq -er .version package.json)"
          tag="v${version}"

          # A dependency bump touches package.json too, so compare the version itself.
          if [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null; then
            before_version="$(git show "${BEFORE}:package.json" 2>/dev/null | jq -er .version 2>/dev/null || true)"
            if [ "$version" = "$before_version" ]; then
              echo "Version unchanged at ${version} - nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Empty only on a repository with no v* tag yet.
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"

          {
            echo "release=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "previous=${previous}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} (prerelease=${prerelease}, previous=${previous:-none})"

      - name: Compose release notes
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ghcr rejects an uppercase path; metadata-action lowercases the same way at build time.
          image_base="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # On disk, so `docker compose pull` cannot deliver a change to them.
          deploy_paths=(docker-compose.yml .env.example docker/clickhouse docker/socket-proxy)

          deploy_changed=""
          if [ -n "$PREVIOUS" ]; then
            deploy_changed="$(git diff --name-only "${PREVIOUS}..HEAD" -- "${deploy_paths[@]}")"
          fi

          {
            echo "## Images"
            echo
            echo '```'
            for service in web caddy agent; do
              echo "${image_base}/${service}:${VERSION}"
            done
            echo '```'
            echo
            echo "Published by the image build this release starts; give it a few minutes. The"
            echo "\`docker-compose.yml\` in the archive below already names these tags, so what you"
            echo "deploy from it stays on this release until you choose to move -- but it also means"
            echo "a \`docker compose pull\` run before the build finishes has nothing to fetch."
            echo
            echo "## Deployment files"
            echo
            if [ -n "$deploy_changed" ]; then
              echo "> [!IMPORTANT]"
              echo "> These live in your checkout, not in the images, so \`docker compose pull\` will"
              echo "> not update them. Pull the repository (or take them from the archive below)"
              echo "> before \`docker compose up -d\`:"
              echo ">"
              while IFS= read -r file; do
                [ -n "$file" ] && echo "> - \`${file}\`"
              done <<< "$deploy_changed"
            elif [ -n "$PREVIOUS" ]; then
              echo "Unchanged since ${PREVIOUS}. Pulling the images is enough."
            else
              echo "First tagged release - take \`docker-compose.yml\` and \`.env.example\` from the archive below."
            fi
            echo
            # Flag both differences from the repository so nobody diffs the two and files a bug.
            echo "The archive holds every file at its top level and deploys as it unpacks -"
            echo "extract it into one directory and \`docker compose up -d\` needs nothing moved."
            echo "Its \`docker-compose.yml\` differs from the copy in the repository in exactly two"
            echo "ways: it mounts the ClickHouse override and the socket proxy template from beside"
            echo "itself rather than from \`./docker/\`, and it pins the three images to \`${VERSION}\` rather than"
            echo "\`latest\`. The repository copy follows \`latest\` on purpose; this one is a snapshot"
            echo "of one release and says so."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              # Capped; the compare link is the better view of a release that long.
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS}..HEAD" | head -n 100
              total="$(git rev-list --no-merges --count "${PREVIOUS}..HEAD")"
              if [ "$total" -gt 100 ]; then
                echo "- …and $((total - 100)) more"
              fi
              echo
              echo "**Full diff:** https://github.com/${REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            else
              echo "Initial release."
            fi
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Package the deployment files
        id: archive
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # An archive, as GitHub renames a dotfile asset (`.env.example`); tar.gz opens on
          # Windows too. Flat, each directory a file prefix, and the staged compose file
          # rewritten to mount from beside itself so it deploys as it unpacks.
          staging="$(mktemp -d)"
          entries=(docker-compose.yml .env.example)
          cp docker-compose.yml .env.example "$staging/"
          # A missing bind source becomes an empty directory the proxy cannot render.
          for dir in clickhouse socket-proxy; do
            for f in "docker/${dir}"/*; do
              entry="${dir}-$(basename "$f")"
              cp "$f" "${staging}/${entry}"
              entries+=("$entry")
            done
            # Host side only.
            sed -i "s#\./docker/${dir}/#./${dir}-#g" "$staging/docker-compose.yml"
          done

          # A snapshot with `:latest` would silently upgrade on a later redeploy. Only our three
          # images: third-party ones are pinned already, and our version would name missing tags.
          # Caddy's is the default inside `${CADDY_IMAGE:-...}`, so an own build can replace it.
          sed -i -E \
            "s#(image: (\\\$\\{CADDY_IMAGE:-)?ghcr\.io/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*/(web|caddy|agent)):latest#\\1:${VERSION}#" \
            "$staging/docker-compose.yml"

          for service in web caddy agent; do
            if ! grep -qE "image: (\\\$\\{CADDY_IMAGE:-)?ghcr\.io/.*/${service}:${VERSION}\\}?\$" "$staging/docker-compose.yml"; then
              echo "::error::staged docker-compose.yml does not pin ${service} to ${VERSION}"
              grep -n 'image:' "$staging/docker-compose.yml"
              exit 1
            fi
          done

          # Nor too far. Compared, not listed, so a Dependabot bump cannot break the release.
          if ! diff <(grep -E '^[[:space:]]*image:' docker-compose.yml | grep -vE '/(web|caddy|agent):') \
                    <(grep -E '^[[:space:]]*image:' "$staging/docker-compose.yml" | grep -vE '/(web|caddy|agent):'); then
            echo "::error::staged docker-compose.yml changed a third-party image reference"
            exit 1
          fi

          # A sed that matched nothing would ship mounts of a directory the archive lacks.
          if grep -qE '\./docker/' "$staging/docker-compose.yml"; then
            echo "::error::staged docker-compose.yml still references ./docker/"
            grep -nE '\./docker/' "$staging/docker-compose.yml"
            exit 1
          fi
          for entry in "${entries[@]}"; do
            case "$entry" in
              clickhouse-*|socket-proxy-*)
                if ! grep -q "\./${entry}:" "$staging/docker-compose.yml"; then
                  echo "::error::staged docker-compose.yml does not mount ${entry}"
                  exit 1
                fi
                ;;
            esac
          done

          name="caddy-proxy-manager-${TAG}-deploy.tar.gz"
          tar -czf "$name" -C "$staging" "${entries[@]}"

          # Asserted: a misnamed `.env.example` would look fine until someone deployed.
          for want in docker-compose.yml .env.example clickhouse-low-disk-write.yml socket-proxy-haproxy.cfg.template; do
            if ! tar -tzf "$name" | grep -qxF "$want"; then
              echo "::error::${name} is missing ${want}"
              tar -tzf "$name"
              exit 1
            fi
          done

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "--- archive contents ---"
          tar -tzvf "$name"

      - name: Create the tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            --title "$TAG"
            --notes-file release-notes.md
            # The checked-out commit, not wherever the branch moved while the run queued.
            --target "$GITHUB_SHA"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          args+=( "$ARCHIVE" )

          gh release create "${args[@]}"

      - name: Build and publish the images for this tag
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag pushed with GITHUB_TOKEN starts no workflow; dispatch is the exception. --ref so
          # metadata-action reads the version off the tag.
          gh workflow run docker-build-trusted.yml --ref "$TAG"
          echo "Dispatched docker-build-trusted at ${TAG}"
          # The docs publish per release. On main: github-pages deploys from main only.
          gh workflow run site.yml --ref main
          echo "Dispatched site"

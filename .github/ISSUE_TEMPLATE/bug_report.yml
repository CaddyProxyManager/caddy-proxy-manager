name: Bug report
description: Something Caddy Proxy Manager does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://caddyproxy.com/) first - the install and feature pages cover the
        common surprises. If you have, and it still looks wrong, you are in the right place.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for similar issues (both open and closed)
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the image digest from `docker inspect --format='{{index .RepoDigests 0}}' <container>` for a `latest` deployment.
      placeholder: "e.g. v3.0.0 or sha256:abc123..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Enough detail to see it ourselves.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag and drop screenshots here.

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which OS is running on the host machine?
      placeholder: "e.g. Ubuntu 24.04, Debian 12, macOS 15"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - The bundled docker-compose.yml, unmodified
        - The bundled docker-compose.yml, modified (describe below)
        - A remote agent on another host
        - Something else (describe below)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Compose modifications, `.env` with secrets removed, container logs, browser version. Too much is better than too little.

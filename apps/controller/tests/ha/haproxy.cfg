# Two controllers behind one address, as ./run.ts runs them. Nothing sticky: any replica serves
# any request. The long timeouts are for the agent's event stream, which stays open for hours.
global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout http-request 30s
  timeout client 1h
  timeout server 1h

# Re-resolved, so a restarted controller is found at its new address.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 2s

frontend controllers
  bind :3000
  default_backend web

backend web
  balance roundrobin
  # A controller that has just stopped refuses the connection: send the request to another.
  retries 3
  option redispatch
  option httpchk GET /api/health
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server web-a web:3000
  server web-b web-b:3000

services:
  # The init script creates the extra databases the web instances below need.
  postgres:
    # No durability for a database `down -v` deletes (as scripts/with-test-db.ts); several web
    # containers share it, so 100 connections is too tight.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      - -c
      - max_connections=300
    volumes:
      - ./apps/controller/tests/postgres-init.sql:/docker-entrypoint-initdb.d/10-e2e.sql:ro

  # Seeds fixtures: the shipped web image has no Bun CLI. The profile keeps it out of `up`; see
  # tests/helpers/seed.ts.
  db-seed:
    image: oven/bun:1.4.2-slim@sha256:cb3bbbb08e13a4a2ff400f24c7a2a1d5efa83f6ef8544d52d95a519631e2fc61
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["bun"]
    networks:
      - database

  web:
    environment:
      # Interpolated only so tests/e2e/functional/secret-rotation.spec.ts can rotate and restore it.
      SESSION_SECRET: "${E2E_WEB_SESSION_SECRET:-test-session-secret-32chars!xxxY}"
      SESSION_SECRET_PREVIOUS: "${E2E_WEB_SESSION_SECRET_PREVIOUS:-}"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      CLICKHOUSE_PASSWORD: "test-clickhouse-password-2026"
      BASE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      OAUTH_ENABLED: "true"
      OAUTH_PROVIDER_NAME: "Dex"
      OAUTH_CLIENT_ID: cpm-test-client
      OAUTH_CLIENT_SECRET: cpm-test-secret
      OAUTH_ISSUER: http://localhost:5556/dex
      OAUTH_AUTHORIZATION_URL: http://localhost:5556/dex/auth
      OAUTH_TOKEN_URL: http://dex:5556/dex/token
      OAUTH_USERINFO_URL: http://dex:5556/dex/userinfo
      OAUTH_ALLOW_AUTO_LINKING: "true"
      # forward-auth-oauth and oauth-role-injection exercise federated signup.
      AUTH_ALLOW_OAUTH_REGISTRATION: "true"
      AUTH_RATE_LIMIT_ENABLED: "false"

  web-registration-enabled:
    container_name: caddy-proxy-manager-web-registration-enabled
    image: ghcr.io/caddyproxymanager/web:latest
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-registration-session-secret-32chars!xxxY"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      BASE_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3001
      # Fields, not a URL, which would have to encode the interpolated password.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpm_registration
      CADDY_API_URL: http://caddy:2019
      # Shares the stack's Caddy with an empty database: two monitors would overwrite each other.
      CADDY_MONITOR_ENABLED: "false"
      AUTH_ALLOW_SELF_REGISTRATION: "true"
      AUTH_RATE_LIMIT_ENABLED: "false"
      OAUTH_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - caddy-manager-registration-data:/app/data
    # Never caddy: the agent starts it, so waiting on it deadlocks `up --wait`.
    depends_on:
      postgres:
        condition: service_healthy
    # caddy-network as well, because an internal network alone cannot publish 3001.
    networks:
      - caddy-network
      - database
    healthcheck:
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  # Auth rate limiting and the login throttle on, which the main instance turns off; its own
  # database, so neither its counters nor its lockouts reach another spec.
  web-ratelimit:
    container_name: caddy-proxy-manager-web-ratelimit
    image: ghcr.io/caddyproxymanager/web:latest
    ports:
      - "3006:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-ratelimit-session-secret-32chars!xY"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      BASE_URL: http://localhost:3006
      NEXTAUTH_URL: http://localhost:3006
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpm_ratelimit
      CADDY_API_URL: http://127.0.0.1:9
      CADDY_MONITOR_ENABLED: "false"
      AUTH_RATE_LIMIT_ENABLED: "true"
      OAUTH_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - web-ratelimit-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy-network
      - database
    healthcheck:
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # DEMO_MODE: an in-memory Caddy and a simulated agent. The seeded admin is every visitor's.
  web-demo:
    container_name: caddy-proxy-manager-web-demo
    image: ghcr.io/caddyproxymanager/web:latest
    ports:
      - "3008:3000"
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
      SESSION_SECRET: "test-demo-session-secret-32chars!xxxYYZ"
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: "TestPassword2026!"
      BASE_URL: http://localhost:3008
      NEXTAUTH_URL: http://localhost:3008
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpm_demo
      # Unreachable on purpose: demo mode must never need it.
      CADDY_API_URL: http://127.0.0.1:9
      AUTH_RATE_LIMIT_ENABLED: "false"
      OAUTH_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - web-demo-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy-network
      - database
    healthcheck:
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: "test-clickhouse-password-2026"
    # For the retention tests; caddy-network because an internal network cannot publish a port.
    ports:
      - "8123:8123"
    networks:
      - caddy-network
  # Still behind its profile: the agent starts it once paired, and would stop one started here,
  # which `up --wait` reports as an exit. global-setup waits for Caddy separately.
  caddy:
    # So Step-CA can reach the ACME test domain for challenges (functional/acme-custom-ca.spec.ts).
    networks:
      caddy-network:
        aliases:
          - acme-e2e.test
    ports:
      - "80:80"
      - "443:443"
      # L4 test ports (TCP)
      - "15432:15432"
      - "15433:15433"
      - "15434:15434"
      # L4 test ports (UDP)
      - "15353:15353/udp"
  # This file instead of a local override, so the agent recreates caddy on the "-test" volumes.
  agent:
    environment:
      COMPOSE_SKIP_OVERRIDE: "1"
      COMPOSE_EXTRA_FILE: /compose/apps/controller/tests/docker-compose.test.yml
      CLICKHOUSE_PASSWORD: "test-clickhouse-password-2026"
  # A second agent for tests/e2e/agents.spec.ts to pair, re-pair and unpair from the UI. Its Docker
  # and Caddy addresses lead nowhere: an idle agent stops Caddy, and this one must never reach the
  # stack's. It idles, unpaired, until that spec runs.
  agent-remote:
    container_name: caddy-proxy-manager-agent-remote
    image: ghcr.io/caddyproxymanager/agent:latest
    environment:
      DATA_DIR: /data
      DOCKER_HOST: tcp://127.0.0.1:9
      CADDY_API_URL: http://127.0.0.1:9
      CADDY_CONTAINER_NAME: caddy-proxy-manager-agent-remote-caddy
      COMPOSE_PROJECT_NAME: cpm-e2e-agent-remote
      CADDY_BUILD_MODE: external
    volumes:
      - agent-remote-data:/data
    networks:
      - caddy-network
  # ── First-run setup, on instances that have never been set up ────────────────
  # Setup is single-use, hence fresh instances. A dead Caddy admin address, or an empty database's
  # startup apply would wipe the routes the other tests created.
  web-setup:
    container_name: caddy-proxy-manager-web-setup
    image: ghcr.io/caddyproxymanager/web:latest
    # Finishing setup exits on purpose, to restart from the stored configuration.
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-setup-session-secret-32chars!xxxYY"
      # No admin credentials and no OAuth: that is what puts it in the setup flow.
      BASE_URL: http://localhost:3004
      NEXTAUTH_URL: http://localhost:3004
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpm_setup
      CADDY_API_URL: http://127.0.0.1:9
      OAUTH_ENABLED: "false"
      AUTH_RATE_LIMIT_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - web-setup-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy-network
      - database
    healthcheck:
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-migrate:
    container_name: caddy-proxy-manager-web-migrate
    image: ghcr.io/caddyproxymanager/web:latest
    # Like web-setup: finishing a migration exits on purpose.
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "test-migrate-session-secret-32chars!xxYY"
      BASE_URL: http://localhost:3005
      NEXTAUTH_URL: http://localhost:3005
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpm_migrate
      CADDY_API_URL: http://127.0.0.1:9
      OAUTH_ENABLED: "false"
      AUTH_RATE_LIMIT_ENABLED: "false"
      CLICKHOUSE_PASSWORD: ""
      # The test writes it into the bind mount, so it is discovered as on a real upgrade.
      LEGACY_SQLITE_PATH: /legacy/caddy-proxy-manager.db
    volumes:
      - web-migrate-data:/app/data
      - ./apps/controller/tests/.legacy:/legacy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy-network
      - database
    healthcheck:
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  dex:
    image: dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yml"]
    volumes:
      - ./apps/controller/tests/dex/config.yml:/etc/dex/config.yml:ro
    ports:
      - "5556:5556"
    networks:
      - caddy-network
  # The LDAP directory for tests/e2e/auth/ldap.spec.ts, reached as openldap:389 by web. Plain LDAP:
  # the image's bundled CA has expired, and TLS is covered by tests/integration/ldap/ldap-client.test.ts.
  openldap:
    image: osixia/openldap:1.5.0
    # Copies the read-only mount below before bootstrap edits it.
    command: ["--copy-service"]
    environment:
      LDAP_TLS: "false"
    volumes:
      - ./apps/controller/tests/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
    networks:
      - caddy-network
    healthcheck:
      test:
        - CMD
        - ldapsearch
        - -x
        - -H
        - ldap://localhost
        - -D
        - cn=admin,dc=example,dc=org
        - -w
        - admin
        - -b
        - uid=ldap-alice,ou=people,dc=example,dc=org
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
  # Hostile IdP for the role-injection (H3) test: Dex cannot emit custom claims, so this injects
  # `role: admin`. The browser uses localhost:5557; mock-oidc:8080 is also the token `iss`.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG_PATH: /config.json
    volumes:
      - ./apps/controller/tests/mock-oidc/config.json:/config.json:ro
    ports:
      - "5557:8080"
    networks:
      - caddy-network
  # A real IdP for back-channel logout. One name for the browser and web alike, since the issuer
  # must match both: specs map `keycloak` to 127.0.0.1 with --host-resolver-rules.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://keycloak:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: e2e-keycloak-admin
    volumes:
      - ./apps/controller/tests/keycloak/cpm-realm.json:/opt/keycloak/data/import/cpm-realm.json:ro
    ports:
      - "8180:8180"
    networks:
      - caddy-network
    healthcheck:
      # No curl in the image; the management port answers readiness.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  # Catches the mail web sends. SMTP auth is enforced, so a send proves the stored password.
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_AUTH: "cpm-smtp:SmtpE2ePassword2026"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"
    networks:
      - caddy-network
  # Cap Standalone, the self-hosted CAPTCHA. The browser reaches it through page.route.
  cap:
    image: tiago2/cap:3.1.14
    environment:
      ADMIN_KEY: e2e-cap-admin-key-0123456789abcdefghij
      REDIS_URL: redis://cap-valkey:6379
    ports:
      - "3007:3000"
    depends_on:
      - cap-valkey
    networks:
      - caddy-network
  cap-valkey:
    image: valkey/valkey:9.2-alpine
    networks:
      - caddy-network
  echo-server:
    image: hashicorp/http-echo
    command: ["-text=echo-ok", "-listen=:8080"]
    networks:
      - caddy-network
  # A different body, so load-balancing tests can tell the upstreams apart.
  echo-server-2:
    image: hashicorp/http-echo
    command: ["-text=echo-server-2", "-listen=:8080"]
    networks:
      - caddy-network
  # Reflects the request, so path-prefix-rewrite tests can see the path Caddy forwarded.
  whoami-server:
    image: traefik/whoami
    networks:
      - caddy-network
  # Stands in for Authelia in the forward-auth functional tests.
  mock-forward-auth:
    image: node:22-alpine
    command: ["node", "/server.js"]
    volumes:
      - ./apps/controller/tests/mock-forward-auth/server.js:/server.js:ro
    networks:
      - caddy-network
  tcp-echo:
    image: cjimti/go-echo
    platform: linux/amd64
    environment:
      TCP_PORT: "9000"
      NODE_NAME: "tcp-echo-ok"
    networks:
      - caddy-network
  udp-echo:
    image: alpine/socat
    command: ["UDP4-RECVFROM:9001,fork", "EXEC:cat"]
    networks:
      - caddy-network

  # ACME CA for the custom-ACME test (#192), at https://step-ca:9000/acme/acme/directory.
  step-ca:
    container_name: caddy-proxy-manager-step-ca
    image: smallstep/step-ca:0.30.2
    environment:
      DOCKER_STEPCA_INIT_NAME: "CPM E2E Step-CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
      DOCKER_STEPCA_INIT_ACME: "true"
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "false"
      DOCKER_STEPCA_INIT_PASSWORD: "e2e-step-ca-password"
    volumes:
      - step-ca-data:/home/step
    networks:
      - caddy-network

volumes:
  caddy-manager-data:
    name: caddy-manager-data-test
  caddy-manager-registration-data:
    name: caddy-manager-registration-data-test
  agent-data:
    name: agent-data-test
  agent-remote-data:
    name: agent-remote-data-test
  web-setup-data:
    name: web-setup-data-test
  web-migrate-data:
    name: web-migrate-data-test
  web-ratelimit-data:
    name: web-ratelimit-data-test
  web-demo-data:
    name: web-demo-data-test
  caddy-data:
    name: caddy-data-test
  caddy-config:
    name: caddy-config-test
  caddy-logs:
    name: caddy-logs-test
  clickhouse-data:
    name: clickhouse-data-test
  acme-ca:
    name: acme-ca-test
  step-ca-data:
    name: step-ca-data-test

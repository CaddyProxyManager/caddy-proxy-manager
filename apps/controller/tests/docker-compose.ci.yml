# CI-only layer cache: `type=gha` needs the runner's credentials, so only e2e.yml names this file.
# One scope per image, or the builds evict each other's layers. mode=max keeps the builder stages,
# where the expensive work is, which mode=min would throw away.
services:
  web:
    build:
      cache_from:
        - type=gha,scope=e2e-web
      cache_to:
        - type=gha,mode=max,scope=e2e-web

  caddy:
    build:
      cache_from:
        - type=gha,scope=e2e-caddy
      cache_to:
        - type=gha,mode=max,scope=e2e-caddy

  agent:
    build:
      cache_from:
        - type=gha,scope=e2e-agent
      cache_to:
        - type=gha,mode=max,scope=e2e-agent

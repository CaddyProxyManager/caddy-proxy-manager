# Disables ClickHouse's diagnostic system-log tables, which flush several GB/day even when idle
# and are never queried here. Remove this file and restart ClickHouse to debug with them.

asynchronous_metric_log:
  "@remove": "1"
metric_log:
  "@remove": "1"
histogram_metric_log:
  "@remove": "1"
trace_log:
  "@remove": "1"
query_log:
  "@remove": "1"
query_thread_log:
  "@remove": "1"
query_views_log:
  "@remove": "1"
part_log:
  "@remove": "1"
processors_profile_log:
  "@remove": "1"
text_log:
  "@remove": "1"
session_log:
  "@remove": "1"
opentelemetry_span_log:
  "@remove": "1"
blob_storage_log:
  "@remove": "1"
backup_log:
  "@remove": "1"

# The rig's tailnet control server. No working DERP: every node sits on the same bridge, so peers
# reach each other directly, and the rig has no egress to Tailscale's relays anyway. Headscale
# refuses an empty map, so derp.yaml names a relay nothing answers for.
server_url: http://headscale:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls: []
  paths:
    - /etc/headscale/derp.yaml
  auto_update_enabled: false

disable_check_updates: true

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  level: info

# MagicDNS, so the client finds Caddy's node by name: <node>.tail.rig.
dns:
  magic_dns: true
  base_domain: tail.rig
  override_local_dns: false
  nameservers:
    global: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# Every name under cpm.test - including bare cpm.test and any depth of
# subdomain - resolves to the Caddy container. Test proxy hosts can therefore
# invent domains freely without touching this file.
address=/cpm.test/172.28.0.10

# Answer everything under cpm.test from local data only. Without this, `address` covers A records
# but AAAA queries are forwarded upstream, where they fail - and that SERVFAIL makes musl's
# getaddrinfo give up on the name entirely, so AF_UNSPEC lookups (openssl s_client) cannot connect.
# With `local`, an AAAA query gets an authoritative empty answer.
local=/cpm.test/

# Subzones answered elsewhere; the more specific domain beats the two lines above. dyn.cpm.test
# is CoreDNS, holding the records tests change at run time; acmedns.cpm.test is acme-dns. dnsmasq
# cannot follow a CNAME to a name it forwards, which a DNS-01 delegation needs, so CoreDNS does.
server=/dyn.cpm.test/172.28.0.6
server=/acmedns.cpm.test/172.28.0.27
# BIND, which the rfc2136 DNS provider updates over TSIG.
server=/rfc.cpm.test/172.28.0.53

# Third-party hosts the controller calls out to, answered by the rig's own `files` server with a
# certificate from the rig CA. `local` for the same reason as cpm.test above: no AAAA forwarded.
address=/download.maxmind.com/172.28.0.52
address=/updates.maxmind.com/172.28.0.52
address=/api.github.com/172.28.0.52
address=/raw.githubusercontent.com/172.28.0.52
address=/files.rig.internal/172.28.0.52
local=/download.maxmind.com/
local=/updates.maxmind.com/
local=/api.github.com/
local=/raw.githubusercontent.com/
local=/files.rig.internal/

# Do not read the container's /etc/resolv.conf or /etc/hosts; the only upstream
# is Docker's embedded resolver, which answers for container names on the
# networks this container is attached to.
no-resolv
no-hosts
server=127.0.0.11

# Ask upstreams in the order listed and never cache a negative answer for long:
# Caddy's address is static, but container names come and go between runs.
strict-order
neg-ttl=1
local-ttl=1

# No listen-address/interface restriction: dnsmasq listens on every interface
# in the container by default, which is what the clients and the health check
# both need, and the container is only reachable on the isolated test network.
port=53
log-queries=extra

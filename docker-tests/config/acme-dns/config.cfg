# Authoritative for acmedns.cpm.test: dnsmasq forwards the zone here, and the NS record lets
# certmagic's propagation check find this server and ask it directly.
[general]
listen = "0.0.0.0:53"
protocol = "both"
domain = "acmedns.cpm.test"
nsname = "ns.acmedns.cpm.test"
nsadmin = "admin.cpm.test"
records = [
    "acmedns.cpm.test. A 172.28.0.27",
    "ns.acmedns.cpm.test. A 172.28.0.27",
    "acmedns.cpm.test. NS ns.acmedns.cpm.test.",
]
debug = false

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
disable_registration = false
port = "80"
# Plain http: the controller allows it for a single-label name such as this service's.
tls = "none"
corsorigins = ["*"]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "debug"
logtype = "stdout"
logformat = "text"

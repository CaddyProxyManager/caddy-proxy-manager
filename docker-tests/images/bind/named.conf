// Authoritative only: dnsmasq forwards rfc.cpm.test here, and nothing else is asked.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

// suite/tests/18-dns-provider-rfc2136.sh sends the same name, algorithm and secret to CPM.
key "cpm-rig" {
    algorithm hmac-sha256;
    secret "Y3BtLWRvY2tlci10ZXN0cy1yZmMyMTM2LXRzaWctMDE=";
};

zone "rfc.cpm.test" {
    type primary;
    file "/var/lib/bind/db.rfc.cpm.test";
    // TXT only, so a stolen key could not repoint a name.
    update-policy { grant cpm-rig zonesub TXT; };
};

# Full-stack rig on one *internal* network, certificates from an in-network Pebble. Static IPs
# because dnsmasq answers *.cpm.test with Caddy's address, and Pebble validates through dnsmasq.
name: cpm-docker-tests

networks:
  cpm-test:
    name: cpm-test
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  # The agent phase's Docker API, which nothing else can reach.
  cpm-test-docker:
    name: cpm-test-docker
    driver: bridge
    internal: true
  # The runner's, for `cscli` in the CrowdSec containers and retagging the operator's Caddy image.
  cpm-test-runner-docker:
    name: cpm-test-runner-docker
    driver: bridge
    internal: true

volumes:
  postgres-data: # postgres: the controller's database
  cpm-data:      # web: certificates and shared state
  caddy-data:    # caddy: certificate storage
  caddy-config:  # caddy: autosave.json
  caddy-logs:    # shared: unread here (no agent), but the log paths in Caddy's config must exist
  acme-ca:       # shared: web writes the ACME CA root PEM, caddy reads it
  test-certs:    # certgen output: pebble server cert, https-origin cert
  agent-data:    # agent phase: the agent's state
  crowdsec-lapi-data: # agent phase: the external CrowdSec's database
  crowdsec-data:      # agent phase: the managed CrowdSec, as docker-compose.yml names them
  crowdsec-config:
  rig-zones:          # the dyn.cpm.test zone file: the runner writes it, CoreDNS serves it
  # agent phase: CERT_FILES_HOST_DIR. Named, so its host path below is known in advance.
  cert-files:
    name: cpm-test-cert-files

services:
  # ── Test PKI ────────────────────────────────────────────────────────────
  # One-shot: the CA for Pebble's HTTPS endpoint, and a deliberately mismatched cert for the
  # HTTPS origin so upstream hostname verification has something to fail on.
  certgen:
    build:
      context: ./images/runner
    image: cpm-test/runner:latest
    container_name: cpm-test-certgen
    command: ["bash", "/certgen/gen-certs.sh"]
    volumes:
      - ./certgen:/certgen:ro
      - test-certs:/certs
    networks:
      cpm-test:
        ipv4_address: 172.28.0.4

  # ── DNS ─────────────────────────────────────────────────────────────────
  # *.cpm.test resolves to Caddy; the rest forwards to Docker's resolver for container names.
  dns:
    build:
      context: ./images/dns
    image: cpm-test/dns:latest
    container_name: cpm-test-dns
    volumes:
      - ./config/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      cpm-test:
        ipv4_address: 172.28.0.5
    healthcheck:
      # A-only: busybox nslookup waits out the full timeout on the empty AAAA answer.
      test: ["CMD", "nslookup", "-type=a", "probe.cpm.test", "127.0.0.1"]
      interval: 3s
      timeout: 5s
      retries: 10

  # dnsmasq forwards dyn.cpm.test here. No healthcheck: the image has nothing to run one with.
  coredns:
    image: coredns/coredns:1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
    container_name: cpm-test-coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./config/coredns/Corefile:/etc/coredns/Corefile:ro
      - rig-zones:/zones:ro
    networks:
      cpm-test:
        ipv4_address: 172.28.0.6

  # For DNS challenge delegation: an acme-dns account per domain, CNAMEd to from dyn.cpm.test.
  acme-dns:
    image: joohoi/acme-dns:v1.0@sha256:08435bf0c6cfe7c29816ff48beabcc333743b5bb060cae3867777d9b0d956517
    container_name: cpm-test-acme-dns
    volumes:
      - ./config/acme-dns/config.cfg:/etc/acme-dns/config.cfg:ro
    networks:
      cpm-test:
        ipv4_address: 172.28.0.27

  # ── ACME certificate authority ──────────────────────────────────────────
  # httpPort/tlsPort are overridden so validation hits Caddy on the standard ports.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    container_name: cpm-test-pebble
    command:
      - -config
      - /pebble/config.json
      - -dnsserver
      - 172.28.0.5:53
    environment:
      # Pebble's client-hardening defaults make a suite flaky: no delay, no nonce rejection.
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ./config/pebble/config.json:/pebble/config.json:ro
      - test-certs:/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      dns:
        condition: service_healthy
    dns:
      - 172.28.0.5
    networks:
      cpm-test:
        ipv4_address: 172.28.0.30

  # ── System under test ───────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cpm
      POSTGRES_PASSWORD: docker-tests
      POSTGRES_DB: cpm
    volumes:
      # The parent directory, as the 18+ images expect - see the root docker-compose.yml.
      - postgres-data:/var/lib/postgresql
    networks:
      - cpm-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpm -d cpm"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    build:
      context: ..
      dockerfile: docker/caddy/Dockerfile
    # The agent phase's agent sets this to the image it loads; everything else runs the rig's own.
    image: ${CADDY_IMAGE:-cpm-test/caddy:latest}
    container_name: cpm-test-caddy
    environment:
      DASHBOARD_DOMAIN: cpm.test
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/logs
      - acme-ca:/acme-ca:ro
    # Docker's resolver forwards what it does not know here, as a host's would go to its own DNS:
    # certmagic dials the nameserver a DNS-01 propagation check finds by name.
    dns:
      - 172.28.0.5
    networks:
      cpm-test:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    image: cpm-test/web:latest
    container_name: cpm-test-web
    environment:
      NODE_ENV: production
      SESSION_SECRET: test-session-secret-not-for-production-use-0123456789
      CADDY_API_URL: http://caddy:2019
      # Dotted alias, not `web`: curl 8.22 never sends back a cookie set by a single-label host,
      # losing the runner's session. CPM_API on the runner must match.
      BASE_URL: http://web.cpm.internal:3000
      NEXTAUTH_URL: http://web.cpm.internal:3000
      DATABASE_URL: postgres://cpm:docker-tests@postgres:5432/cpm
      APP_NAME: CPM Docker Test
      AVATAR_GRAVATAR: "false"
      ADMIN_USERNAME: cpmadmin
      ADMIN_PASSWORD: ${CPM_TEST_ADMIN_PASSWORD:-Dock3r-T3st!Passw0rd}
      AUTH_ALLOW_SELF_REGISTRATION: "false"
      AUTH_ALLOW_OAUTH_REGISTRATION: "false"
      AUTH_DISABLE_LOCAL_USERS: "false"
      OAUTH_ENABLED: "false"
      # No ClickHouse in the rig - an empty password disables analytics.
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - cpm-data:/app/data
      - caddy-logs:/logs
      - acme-ca:/acme-ca
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_healthy
    # For the lookups the controller makes with the system resolver, the delegation check's among them.
    dns:
      - 172.28.0.5
    networks:
      cpm-test:
        ipv4_address: 172.28.0.11
        aliases:
          - web.cpm.internal
    healthcheck:
      # The runtime stage has only the compiled binary - no Bun CLI, curl or wget.
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── Simulated proxy destinations ────────────────────────────────────────
  # origin-a and origin-b differ only in the id they report, for load-balancing tests.
  origin-a:
    build:
      context: ./images/backend
    image: cpm-test/backend:latest
    container_name: cpm-test-origin-a
    command: ["http", "8080"]
    environment:
      ORIGIN_ID: origin-a
    networks:
      cpm-test:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/__health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  origin-b:
    image: cpm-test/backend:latest
    container_name: cpm-test-origin-b
    command: ["http", "8080"]
    environment:
      ORIGIN_ID: origin-b
    depends_on:
      origin-a:
        condition: service_started
    networks:
      cpm-test:
        ipv4_address: 172.28.0.21
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/__health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Certificate deliberately mismatches, so `skipHttpsHostnameValidation` has work to do.
  origin-tls:
    image: cpm-test/backend:latest
    container_name: cpm-test-origin-tls
    command: ["https", "8443", "/certs/origin-tls.crt.pem", "/certs/origin-tls.key.pem"]
    environment:
      ORIGIN_ID: origin-tls
    volumes:
      - test-certs:/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      origin-a:
        condition: service_started
    networks:
      cpm-test:
        ipv4_address: 172.28.0.22

  # L4 destinations: raw TCP and UDP.
  origin-tcp:
    image: cpm-test/backend:latest
    container_name: cpm-test-origin-tcp
    command: ["tcp", "9000"]
    environment:
      ORIGIN_ID: origin-tcp
    depends_on:
      origin-a:
        condition: service_started
    networks:
      cpm-test:
        ipv4_address: 172.28.0.23

  origin-udp:
    image: cpm-test/backend:latest
    container_name: cpm-test-origin-udp
    command: ["udp", "9001"]
    environment:
      ORIGIN_ID: origin-udp
    depends_on:
      origin-a:
        condition: service_started
    networks:
      cpm-test:
        ipv4_address: 172.28.0.24

  # ── Bot challenge ───────────────────────────────────────────────────────
  # Anubis in subrequest mode (TARGET a space), as bot-challenge.mdx tells operators to run it.
  anubis:
    image: ghcr.io/techarohq/anubis:v1.27.0
    container_name: cpm-test-anubis
    environment:
      TARGET: " "
      BIND: ":8923"
      POLICY_FNAME: /data/policy.yaml
      REDIRECT_DOMAINS: bot-challenge.cpm.test
      # Fixed, so a pass survives a restart of the rig's Anubis between runs.
      ED25519_PRIVATE_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SLOG_LEVEL: DEBUG
    volumes:
      - ./config/anubis/policy.yaml:/data/policy.yaml:ro
    networks:
      cpm-test:
        ipv4_address: 172.28.0.25
    healthcheck:
      test: ["CMD", "/ko-app/anubis", "--healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── Agent phase (run.sh, after the main suite) ─────────────────────────
  # An agent in external build mode, behind a socket proxy with BuildKit denied: it must load an
  # image built elsewhere, never build one. Last, because pairing moves every admin call onto it.

  # Built, never run: the image an operator would build for it. One DNS module and nothing else,
  # so the rig's own image and this one differ in the module list the agent must read.
  caddy-external:
    profiles: ["agent-build"]
    build:
      context: ..
      dockerfile: docker/caddy/Dockerfile
      args:
        CADDY_MODULES: github.com/caddy-dns/cloudflare
    image: cpm-test/caddy:external

  # The shipped list plus Rate Limit and CrowdSec, which run.sh reads off the Dockerfile's default.
  # Tests retag it as cpm-test/caddy:external and load it, as an operator rebuilding would.
  # Not `:?`: the agent's compose interpolates this file too, and would fail on every call.
  caddy-opt-in:
    profiles: ["agent-build"]
    build:
      context: ..
      dockerfile: docker/caddy/Dockerfile
      args:
        CADDY_MODULES: ${CPM_TEST_OPT_IN_MODULES:-}
    image: cpm-test/caddy:opt-in

  # An operator's own CrowdSec, for Settings → CrowdSec in external mode. Same image as the managed
  # one below, with a bouncer key the tests hand to the settings API.
  crowdsec-lapi:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: docker-tests/images/crowdsec/Dockerfile
    image: cpm-test/crowdsec:latest
    container_name: cpm-test-crowdsec-lapi
    environment:
      COLLECTIONS: crowdsecurity/caddy crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_caddy: cpm-docker-tests-crowdsec-bouncer-key
      DISABLE_ONLINE_API: "true"
      # The image dropped it already; the COLLECTIONS reinstall must not bring it back.
      DISABLE_PARSERS: crowdsecurity/whitelists
    volumes:
      - crowdsec-lapi-data:/var/lib/crowdsec/data
      - caddy-logs:/logs:ro
    networks:
      cpm-test:
        ipv4_address: 172.28.0.26
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 3s
      timeout: 10s
      retries: 40

  # docker-compose.yml's managed service, which the agent starts with `--profile crowdsec`. The
  # image replaces the pinned one only to carry the hub content; the whitelists parser is the one
  # other difference, since every address in the rig is private.
  crowdsec:
    profiles: ["crowdsec"]
    image: cpm-test/crowdsec:latest
    # Built by crowdsec-lapi; the agent's compose must never try to pull or build it.
    pull_policy: never
    container_name: cpm-test-crowdsec
    environment:
      COLLECTIONS: crowdsecurity/caddy crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:-}
      DISABLE_ONLINE_API: ${CROWDSEC_DISABLE_ONLINE_API:-true}
      DISABLE_PARSERS: crowdsecurity/whitelists
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - caddy-logs:/logs:ro
    networks:
      cpm-test:
        aliases:
          - cpm-crowdsec
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 3s
      timeout: 10s
      retries: 40

  # The runner's: exec for `cscli`, images for the retag. Not the agent's proxy, which denies exec.
  runner-docker-proxy:
    profiles: ["agent"]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: cpm-test-runner-docker-proxy
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      POST: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cpm-test-runner-docker

  docker-socket-proxy:
    profiles: ["agent"]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: cpm-test-docker-proxy
    environment:
      CONTAINERS: 1
      POST: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      # The point of the phase: no BuildKit, so a build could not run even if the agent tried.
      GRPC: 0
      SESSION: 0
      BUILD: 0
      EVENTS: 0
      EXEC: 0
      SWARM: 0
      AUTH: 0
      SECRETS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../docker/socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - cpm-test-docker

  agent:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
    image: cpm-test/agent:latest
    container_name: cpm-test-agent
    environment:
      DATA_DIR: /data
      # Pairs itself with the bootstrap token web leaves there, as the bundled agent does.
      CONTROLLER_DATA_DIR: /controller-data
      CONTROLLER_URL: http://web:3000
      COMPOSE_DIR: /compose
      CADDY_API_URL: http://caddy:2019
      CADDY_CONTAINER_NAME: cpm-test-caddy
      CADDY_BUILD_MODE: external
      CADDY_IMAGE: cpm-test/caddy:external
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # A path on the Docker host, which the agent bind-mounts into a throwaway container: the
      # named volume's own directory, which the runner writes through its mount of it.
      CERT_FILES_HOST_DIR: ${CPM_TEST_DOCKER_ROOT:-/var/lib/docker}/volumes/cpm-test-cert-files/_data
    group_add:
      # web's, for the bootstrap token.
      - "10001"
    volumes:
      - agent-data:/data
      - cpm-data:/controller-data:ro
      # This directory, so the agent's compose manages the rig's own caddy service.
      - .:/compose:ro
      - caddy-logs:/logs
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks:
      cpm-test:
        ipv4_address: 172.28.0.12
      cpm-test-docker: {}

  # ── Simulated client ────────────────────────────────────────────────────
  # Drives the tests, resolving through dnsmasq as a browser would.
  runner:
    build:
      context: ./images/runner
    image: cpm-test/runner:latest
    container_name: cpm-test-runner
    command: ["sleep", "infinity"]
    environment:
      CPM_API: http://web.cpm.internal:3000
      CPM_ADMIN_USER: cpmadmin
      CPM_ADMIN_PASSWORD: ${CPM_TEST_ADMIN_PASSWORD:-Dock3r-T3st!Passw0rd}
      TEST_DOMAIN: cpm.test
      CADDY_IP: 172.28.0.10
      CLIENT_IP: 172.28.0.40
      PEBBLE_DIRECTORY: https://pebble:14000/dir
      PEBBLE_MGMT: https://pebble:15000
      TEST_GEOBLOCK: ${CPM_TEST_GEOBLOCK:-1}
      TEST_WAF: ${CPM_TEST_WAF:-1}
      # Up in the agent phase only.
      DOCKER_HOST: tcp://runner-docker-proxy:2375
    volumes:
      - ./suite:/suite:ro
      - test-certs:/certs:ro
      - rig-zones:/zones
      - cert-files:/cert-files
    # To add a second source address (lib.sh, add_client_alias): "another client" to an IP rule.
    cap_add:
      - NET_ADMIN
    depends_on:
      web:
        condition: service_healthy
      dns:
        condition: service_healthy
      pebble:
        condition: service_started
      origin-a:
        condition: service_healthy
      origin-b:
        condition: service_healthy
      origin-tls:
        condition: service_started
      origin-tcp:
        condition: service_started
      origin-udp:
        condition: service_started
      anubis:
        condition: service_healthy
      coredns:
        condition: service_started
      acme-dns:
        condition: service_started
    dns:
      - 172.28.0.5
    networks:
      cpm-test:
        ipv4_address: 172.28.0.40
      cpm-test-runner-docker: {}
